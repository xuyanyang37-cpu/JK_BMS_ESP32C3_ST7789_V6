name: ESP32-C3 PlatformIO Build

on:
  push:
    branches:
      - main
      - ci/platformio-build-check
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile ESP32-C3 firmware
        run: pio run -e esp32-c3-devkitm-1
